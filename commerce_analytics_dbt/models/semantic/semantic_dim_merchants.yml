version: 2

semantic_models:
  - name: merchants
    description: "Semantic model for food delivery merchants."
    model: ref('dim_merchants')

    defaults:
      agg_time_dimension: first_order_date

    entities:
      - name: merchant
        type: primary
        expr: merchant_key

    dimensions:
      - name: source_platform
        type: categorical

      - name: merchant_name
        type: categorical

      - name: merchant_legal_name
        type: categorical

      - name: first_order_date
        type: time
        expr: first_order_date
        type_params:
          time_granularity: day

      - name: last_order_date
        type: time
        expr: last_order_date
        type_params:
          time_granularity: day

    measures:
      - name: merchant_count_measure
        agg: count_distinct
        expr: merchant_key

      - name: merchant_lifetime_spend_measure
        agg: sum
        expr: lifetime_spend

      - name: merchant_order_count_measure
        agg: sum
        expr: merchant_order_count

metrics:
  - name: merchant_count
    label: "Merchant Count"
    type: simple
    type_params:
      measure: merchant_count_measure

  - name: merchant_lifetime_spend
    label: "Merchant Lifetime Spend"
    type: simple
    type_params:
      measure: merchant_lifetime_spend_measure

  - name: merchant_total_orders
    label: "Merchant Total Orders"
    type: simple
    type_params:
      measure: merchant_order_count_measure

  - name: merchant_average_order_value
    label: "Merchant Average Order Value"
    type: ratio
    type_params:
      numerator: merchant_lifetime_spend
      denominator: merchant_total_orders