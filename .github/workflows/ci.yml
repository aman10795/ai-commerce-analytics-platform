name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  python-dbt-mcp-checks:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      DBT_PROFILES_DIR: ${{ github.workspace }}/.github/dbt_profiles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Python import smoke test
        run: |
          python -c "import analytics.ai_metric_query"
          python -c "import analytics.mcp_agent"
          python -c "import mcp_server.server"

      - name: Install dbt dependencies
        working-directory: commerce_analytics_dbt
        run: |
          dbt deps

      - name: Create demo DuckDB warehouse
        run: |
          python scripts/demo/create_demo_warehouse.py --reset

      - name: dbt parse
        working-directory: commerce_analytics_dbt
        run: |
          dbt parse --target demo

      - name: dbt build on demo data
        working-directory: commerce_analytics_dbt
        run: |
          dbt build --target demo

      - name: MCP server smoke test
        run: |
          python scripts/evals/test_mcp_smoke.py

  docker-publish:
    runs-on: ubuntu-latest
    needs: python-dbt-mcp-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}